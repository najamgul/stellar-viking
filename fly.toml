app = 'stellar-viking'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[mounts]
  source = 'sv_data'
  destination = '/data'

[checks]
  [checks.health]
    type = 'http'
    port = 8080
    path = '/health'
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'
